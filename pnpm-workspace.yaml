minimumReleaseAge: 10080
# Reviewed security release; all other packages retain the seven-day delay.
minimumReleaseAgeExclude:
  - next@16.3.8
  - eslint-config-next@16.3.8
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  sharp: true
  unrs-resolver: true
overrides:
  '@babel/core': 7.29.7
  baseline-browser-mapping: 2.11.0
  'brace-expansion@1.1.14': 1.1.21
  'brace-expansion@5.0.6': 5.0.12
  browserslist: 4.28.7
  'js-yaml@4.1.1': 4.3.2
  # Next's root-directory lookup only uses globSync(..., { onlyDirectories: true }).
  # tinyglobby supplies that API without braces (GHSA-vfj7-8cjw-p6xm).
  # The paired patch preserves directory semantics; test:security checks them.
  '@next/eslint-plugin-next@16.3.8>fast-glob': npm:tinyglobby@0.2.16
patchedDependencies:
  '@next/eslint-plugin-next@16.3.8': patches/@next__eslint-plugin-next@16.3.8.patch
